name: Test custom configuration path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: feature-custom-config
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom auto_assign config at non-default path
        run: |
          mkdir -p .github/custom
          cat > .github/custom/my_auto_assign.yml << 'EOF'
          addReviewers: true
          addAssignees: false
          reviewers:
            - reviewerA
            - reviewerB
          numberOfReviewers: 1
          EOF

      - id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/custom/my_auto_assign.yml
        continue-on-error: true

      - name: Assert action ran with custom config path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not crash) even with a fake token.
          # It will fail at the GitHub API call stage, which is expected.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
