name: Test custom configuration path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a valid auto_assign config at a custom path
      - name: Create custom auto_assign config
        run: |
          mkdir -p .github/custom
          cat > .github/custom/auto_assign.yml << 'EOF'
          addReviewers: true
          addAssignees: true
          reviewers:
            - octocat
            - hubot
          numberOfReviewers: 1
          assignees:
            - octocat
          numberOfAssignees: 1
          skipKeywords:
            - wip
            - draft
          EOF

      # Run the action with a custom configuration-path.
      # Under workflow_dispatch there is no pull_request payload, so the action
      # will call setFailed("the webhook payload is not exist"). This is the
      # expected outcome — it means the config was loaded successfully and the
      # action reached the PR-handling stage.
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/custom/auto_assign.yml
        continue-on-error: true

      # Assert the action failed with the expected PR-payload error (not a
      # config-loading error), confirming the custom path was read correctly.
      - name: Assert action failed with expected PR payload error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing PR payload, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request payload is present (custom config path was read)"
