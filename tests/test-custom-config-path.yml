name: Test custom configuration path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a custom auto_assign config at a non-default path
      - name: Create custom auto_assign config
        run: |
          mkdir -p .github/custom
          cat > .github/custom/auto_assign.yml << 'EOF'
          addReviewers: true
          addAssignees: false
          reviewers:
            - octocat
          numberOfReviewers: 1
          skipKeywords:
            - wip
            - draft
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: '.github/custom/auto_assign.yml'

      - name: Assert action ran (failed gracefully without PR payload)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no pull_request payload,
          # so the action is expected to fail with "the webhook payload is not exist".
          # We accept both failure (expected) and success (if action handles it gracefully).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
