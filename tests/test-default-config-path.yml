name: Test default configuration path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action uses the default configuration-path (.github/auto_assign.yml)
      # when no configuration-path input is provided.
      # The action will fail because:
      #   1. The default config path may not exist (404 from API), OR
      #   2. There is no pull_request payload under workflow_dispatch.
      # Either way, the action should fail gracefully via core.setFailed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          # configuration-path intentionally omitted to use default: .github/auto_assign.yml

      - name: Assert action failed gracefully with default config path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR payload or missing default config), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using default configuration path without a PR event"
