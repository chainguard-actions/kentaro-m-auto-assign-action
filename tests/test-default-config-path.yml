name: Test default configuration path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repo-token: invalid-token-for-testing
          # No configuration-path provided — should use default '.github/auto_assign.yml'
        continue-on-error: true

      - name: Assert action ran and failed gracefully using default config path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (not crash) when given an invalid token
          # even when using the default configuration path
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token using default config path, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed gracefully using default configuration path"
