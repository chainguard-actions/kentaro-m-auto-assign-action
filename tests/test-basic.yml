name: Test basic usage - no PR payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action fetches config via GitHub API using the real token.
      # Under workflow_dispatch there is no pull_request payload, so the action
      # will call core.setFailed("the webhook payload is not exist").
      # We use continue-on-error to capture this expected failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: tests/fixtures/auto_assign.yml

      - name: Assert action failed with expected error (no PR payload)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing PR payload, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request payload is present"
