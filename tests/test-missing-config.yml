name: Test missing configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Do NOT create the config file — test that the action handles missing config gracefully
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: '.github/nonexistent_auto_assign.yml'

      - name: Assert action failed gracefully (missing config or no PR payload)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because either:
          # 1. The config file does not exist (GitHub API 404), or
          # 2. There is no pull_request payload (workflow_dispatch event)
          # Either way, the action should fail gracefully via core.setFailed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
