name: Test missing configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When the configuration-path points to a non-existent file, the GitHub API
      # returns 404 and the action should call core.setFailed with an error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/nonexistent-auto-assign-config.yml

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing config file, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when configuration file does not exist"
