name: Test missing configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action pointing to a config file that does NOT exist.
      # The action should fail when trying to fetch the configuration file
      # from the repository (GitHub API returns 404 or similar error).
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/nonexistent_auto_assign.yml
        continue-on-error: true

      # Assert the action failed (config file not found)
      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing config file, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when configuration file does not exist"
