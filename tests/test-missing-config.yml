name: Test missing configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action tries to fetch a non-existent config file via GitHub API.
      # It should fail because the file does not exist.
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/this-file-does-not-exist-auto-assign.yml
        continue-on-error: true

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing config file) but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (missing config file)"
