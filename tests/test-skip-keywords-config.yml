name: Test skip keywords configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a config with skipKeywords set
      - name: Create auto_assign config with skipKeywords
        run: |
          mkdir -p .github
          cat > .github/auto_assign.yml << 'EOF'
          addReviewers: true
          addAssignees: true
          reviewers:
            - reviewer1
            - reviewer2
          assignees:
            - assignee1
          numberOfReviewers: 1
          numberOfAssignees: 1
          skipKeywords:
            - wip
            - "[skip ci]"
            - draft
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          configuration-path: '.github/auto_assign.yml'

      - name: Assert action ran (failed gracefully without PR payload)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no pull_request payload,
          # so the action is expected to fail with "the webhook payload is not exist".
          # The important thing is the action doesn't crash unexpectedly.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
