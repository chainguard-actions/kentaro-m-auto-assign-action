name: Test pull_request_target event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request_target
      GITHUB_REF: refs/heads/main
      GITHUB_HEAD_REF: fork-feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run auto-assign action with pull_request_target event (expect failure - no real GitHub API in act)
        id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          configuration-path: .github/auto_assign.yml
        continue-on-error: true

      - name: Assert action ran and failed gracefully under pull_request_target event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real GitHub API), but not crash unexpectedly
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully under pull_request_target event as expected in test environment"
